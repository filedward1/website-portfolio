	<!-- Left: Contact methods -->

		</div>

		<h3 class="text-2xl font-bold syntax-string mb-4">Get in Touch</h3>

		<div class="space-y-4">
			<!-- Email -->
			<a href="mailto:filedwardb@gmail.com" class="flex items-center gap-4 bg-zinc-900/40 rounded-md p-4 border border-zinc-700 hover:bg-zinc-900/60">

	<!-- Right: Message form -->
	<section class="bg-zinc-800 rounded-lg p-6 shadow-lg border border-zinc-700 animate-fade-in">
		<div class="inline-flex items-center gap-2 text-zinc-400 mb-4">
			<i data-lucide="send" aria-hidden="true" class="text-violet-300"></i>
			<span>Send a Message</span>
		</div>

		<h3 class="text-2xl font-bold syntax-string mb-4">Send a Message</h3>

		<form id="contactForm" class="space-y-4" onsubmit="return sendMessage(event)">
			<div>
				<label class="text-zinc-400 text-sm block mb-1">Subject</label>
				<input type="text" name="title" placeholder="Message subject" class="w-full rounded-md p-3 bg-zinc-900/30 border border-zinc-700 text-zinc-200 placeholder:text-zinc-500" />
			</div>

			<div>
				<label class="text-zinc-400 text-sm block mb-1">Name</label>
				<input type="text" name="name" placeholder="Your name" class="w-full rounded-md p-3 bg-zinc-900/30 border border-zinc-700 text-zinc-200 placeholder:text-zinc-500" />
			</div>

			<div>
				<label class="text-zinc-400 text-sm block mb-1">Email</label>
				<input type="email" name="email" placeholder="your@email.com" class="w-full rounded-md p-3 bg-zinc-900/30 border border-zinc-700 text-zinc-200 placeholder:text-zinc-500" />
			</div>

			<div>
				<label class="text-zinc-400 text-sm block mb-1">Message</label>
				<textarea name="message" placeholder="Your message ..." class="w-full rounded-md p-3 bg-zinc-900/30 border border-zinc-700 text-zinc-200 placeholder:text-zinc-500 h-32 resize-y max-w-full"></textarea>
			</div>

			<div class="pt-2">
				<button id="sendMessageBtn" type="submit" class="w-full md:w-auto inline-flex items-center gap-3 justify-center bg-sky-400 hover:bg-sky-500 text-zinc-900 font-semibold rounded-md px-6 py-3">
					<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M22 2L11 13" stroke-linecap="round" stroke-linejoin="round"></path>
						<path d="M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"></path>
					</svg>
					<span id="sendMessageLabel">Send Message</span>
				</button>
			</div>

			<p id="sendMessageStatus" class="text-sm text-zinc-400 min-h-5"></p>
		</form>
	</section>
</div>

<!-- EmailJS integration: include SDK and use sendForm() to send directly from the frontend -->
<script type="text/javascript" src="https://cdn.emailjs.com/sdk/3.2.0/email.min.js"></script>
<script>
	// Initialize EmailJS with your public user ID (replace with your actual user/public key)
	(function () {
		if (window.emailjs) {
			emailjs.init('Q-XjxT_Chmj4tPCbs');
		}
	})();

	function sendMessage(e) {
		e.preventDefault();
		const SERVICE_ID = 'service_tg3gq4s';
		const TEMPLATE_ID = 'template_bezj6vs';
		const formData = new FormData(e.target);
		const button = document.getElementById('sendMessageBtn');
		const buttonLabel = document.getElementById('sendMessageLabel');
		const status = document.getElementById('sendMessageStatus');
		const payload = {
			name: (formData.get('name') || '').toString(),
			message: (formData.get('message') || '').toString(),
			title: (formData.get('title') || '').toString(),
			email: (formData.get('email') || '').toString(),
		};

		button.disabled = true;
		button.classList.add('opacity-70', 'cursor-not-allowed');
		buttonLabel.textContent = 'Sending...';
		status.textContent = 'Sending message...';
		status.className = 'text-sm text-sky-300 min-h-5';

		emailjs.send(SERVICE_ID, TEMPLATE_ID, payload)
			.then(function () {
				status.textContent = 'Message sent successfully!';
				status.className = 'text-sm text-emerald-300 min-h-5';
				alert('Message sent successfully!');
				e.target.reset();
			}, function (error) {
				console.error('EmailJS error:', error);
				status.textContent = 'Failed to send message. Please try again later.';
				status.className = 'text-sm text-red-300 min-h-5';
				alert('Failed to send message. Please try again later.');
			})
			.finally(function () {
				button.disabled = false;
				button.classList.remove('opacity-70', 'cursor-not-allowed');
				buttonLabel.textContent = 'Send Message';
			});

		return false;
	}
</script>
