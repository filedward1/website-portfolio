<!doctype html>
<html class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/style.css" rel="stylesheet">
</head>

<body class="h-full overflow-hidden font-mono">
  <div class="flex h-full flex-col">
  <!-- TITLE BAR -->
  <div class="bg-gray-800 flex flex-row px-4 py-1 justify-between items-center border-b border-gray-900">
    <div class="flex gap-2 items-center">
      <div class="flex gap-1.5">
        <div class="w-3 h-3 rounded-full bg-red-400"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-300"></div>
        <div class="w-3 h-3 rounded-full bg-green-300"></div>
      </div>
    </div>
    <span class="text-gray-500 text-xl">my-portfolio.html</span>
    <div class="flex gap-3 items-center text-[#4493f8]">
      <div data-lucide="GitBranch"></div>
      <span class="bg-[#388bfd1a] rounded-md p-2 items-center gap-2">main</span>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="bg-gray-800 flex flex-row shadow-2xl items-center border-b border-gray-900 text-sm">
    <!-- About -->
    <button class="flex flex-row px-3 py-2 border-t gap-2 border-[#4493f8] bg-gray-700 items-center">
      <div data-lucide="user" class="text-[#4493f8] scale-80"></div>
      <span class="text-gray-300">About.html</span>
    </button>
    <!-- Projects -->
    <button class="flex flex-row px-3 py-2 gap-2 hover:bg-gray-600 items-center">
      <div data-lucide="folder-code" class="text-yellow-300 scale-80"></div>
      <span class="text-gray-300">Projects.html</span>
    </button>
    <!-- Contact -->
    <button class="flex flex-row px-3 py-2 gap-2 hover:bg-gray-600 items-center">
      <div data-lucide="mail" class="text-violet-300 scale-80"></div>
      <span class="text-gray-300">Contact.html</span>
    </button>
  </div>

  <!-- Main Content-->
  <div class="flex flex-1 flex-row min-h-0">
    <!-- Sidebar -->
    <div class="flex h-full flex-col w-14 bg-gray-800 pt-8 pb-4 gap-6 text-gray-400 items-center">
      <a href="https://github.com/filedward1" target="_blank">
        <div data-lucide="github" class="scale-90 hover:text-gray-200 hover:scale-100 transition ease-in-out duration-300 active:scale-80"></div>
      </a>
      <a href="https://www.linkedin.com/in/fil-buitizon/" target="_blank">
        <div data-lucide="linkedin" class="scale-90 hover:text-gray-200 hover:scale-100 transition ease-in-out duration-300 active:scale-80"></div>
      </a>
      <a href="https://www.facebook.com/pel.edward.x" target="_blank">
        <div data-lucide="facebook" class="scale-90 hover:text-gray-200 hover:scale-100 transition ease-in-out duration-300 active:scale-80"></div>
      </a>
      <button data-lucide="sun-moon" class="mt-auto scale-90 hover:text-gray-200 hover:scale-100 transition ease-in-out duration-300 active:scale-80"></button>
    </div>
  </div>
  </div>
</body>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
  lucide.createIcons()
  
  const width = window.innerWidth;
  const height = window.innerHeight;

  console.log("Width:", width);
  console.log("Height:", height);
</script>

</html>
