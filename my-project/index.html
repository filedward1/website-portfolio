<!doctype html>
<html class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="h-full overflow-hidden font-mono">
  <div class="flex h-full flex-col">
    <!-- TITLE BAR -->
    <div class="bg-zinc-800 flex flex-row px-4 py-1 justify-between items-center border-b border-black">
      <div class="flex gap-2 items-center">
        <div class="flex gap-1.5">
          <div class="w-3 h-3 rounded-full bg-red-400"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-300"></div>
          <div class="w-3 h-3 rounded-full bg-green-300"></div>
        </div>
      </div>
      <span class="text-gray-500">my-portfolio.html</span>
      <div class="flex gap-3 items-center text-blue-500">
        <i data-lucide="GitBranch" aria-hidden="true"></i>
        <span class="bg-[#388bfd1a] rounded-md p-2 items-center gap-2">main</span>
      </div>
    </div>

    <!-- TAB BAR -->
    <div class="bg-zinc-800 flex flex-row shadow-2xl items-center border-b border-black text-sm">
      <!-- About -->
      <button type="button" data-tab="about" aria-selected="true"
        class="flex flex-row px-3 py-2 border-t gap-2 border-zinc-300 bg-zinc-700 items-center transition ease-in-out duration-300">
        <i data-lucide="user" aria-hidden="true" class="text-blue-500 scale-80"></i>
        <span class="text-gray-300">about.html</span>
      </button>
      <!-- Projects -->
      <button type="button" data-tab="projects" aria-selected="false"
        class="flex flex-row px-3 py-2 gap-2 hover:bg-gray-600 items-center transition ease-in-out duration-300">
        <i data-lucide="folder-code" aria-hidden="true" class="text-yellow-300 scale-80"></i>
        <span class="text-gray-300">projects.json</span>
      </button>
      <!-- History -->
      <button type="button" data-tab="history" aria-selected="false"
        class="flex flex-row px-3 py-2 gap-2 hover:bg-gray-600 items-center transition ease-in-out duration-300">
        <i data-lucide="git-branch" aria-hidden="true" class="text-emerald-300 scale-80"></i>
        <span class="text-gray-300">history.log</span>
      </button>
      <!-- Contact -->
      <button type="button" data-tab="contact" aria-selected="false"
        class="flex flex-row px-3 py-2 gap-2 hover:bg-gray-600 items-center transition ease-in-out duration-300">
        <i data-lucide="mail" aria-hidden="true" class="text-violet-300 scale-80"></i>
        <span class="text-gray-300">contact.html</span>
      </button>
    </div>

    <!-- Main Content-->
    <div class="flex flex-1 flex-row min-h-0 bg-zinc-900">
      <!-- Sidebar -->
      <div
        class="flex h-full flex-col w-14 bg-zinc-800 pt-8 pb-4 gap-6 text-gray-400 items-center border-r border-black">
        <button class="scale-90 hover:text-gray-200 transition ease-in-out duration-300">
          <a href="https://github.com/filedward1" target="_blank">
            <i class="fa-brands fa-github scale-120"></i>
          </a>
        </button>
        <button class="scale-90 hover:text-gray-200 transition ease-in-out duration-300">
          <a href="https://www.linkedin.com/in/fil-buitizon/" target="_blank">
            <i class="fa-brands fa-linkedin scale-120"></i>
          </a>
        </button>
        <button class="scale-90 hover:text-gray-200 transition ease-in-out duration-300">
          <a href="https://www.facebook.com/pel.edward.x" target="_blank">
            <i class="fa-brands fa-facebook scale-120"></i>
          </a>
        </button>
        <button data-lucide="sun-moon" aria-hidden="true"
          class="mt-auto scale-90 hover:text-gray-200 transition ease-in-out duration-300"></button>
      </div>
      <div class="flex-1 p-6 overflow-auto custom-scrollbar">
        <div class="max-w-4xl mx-auto" id="content-container">
          <!-- Content will be loaded here by scripts.js -->
        </div>
      </div>
    </div>
</body>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  lucide.createIcons()
</script>
<script src="scripts.js"></script>

</body>
</html>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
  lucide.createIcons()
</script>
<script src="scripts.js"></script>

</html>
