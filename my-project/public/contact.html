<div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
	<style>
		.contact-field-group {
			position: relative;
		}

		.contact-field-popup {
			position: relative;
			margin-top: 0.5rem;
			display: flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.55rem 0.75rem;
			border-radius: 0.5rem;
			background: rgba(24, 24, 27, 0.96);
			border: 1px solid rgba(248, 113, 113, 0.35);
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
			color: #fecaca;
			font-size: 0.875rem;
			line-height: 1.2;
			max-width: 100%;
			animation: contact-popup-in 160ms ease-out;
		}

		.contact-field-popup::before {
			content: "";
			position: absolute;
			top: -5px;
			left: 1.05rem;
			width: 10px;
			height: 10px;
			transform: rotate(45deg);
			background: rgba(24, 24, 27, 0.96);
			border-left: 1px solid rgba(248, 113, 113, 0.35);
			border-top: 1px solid rgba(248, 113, 113, 0.35);
		}

		.contact-success-dot {
			width: 0.75rem;
			height: 0.75rem;
			border-radius: 999px;
			background: #22c55e;
			box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.35);
			animation: contact-success-pulse 1.1s ease-out 1;
		}


		#sendMessageBtn.send-message-success {
			background: rgba(34, 197, 94, 0.92);
			color: #052e16;
			box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.22), 0 8px 18px rgba(34, 197, 94, 0.12);
			transform: translateY(-1px);
		}

		#sendMessageBtn.send-message-success svg {
			color: #052e16;
		}

		.contact-field-popup.hidden {
			display: none;
		}

		@keyframes contact-popup-in {
			from {
				opacity: 0;
				transform: translateY(-4px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@keyframes contact-success-pulse {
			0% {
				box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.18);
			}
			100% {
				box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
			}
		}
	</style>

	<!-- Left: Contact methods -->
	<div class="w-full">
		<aside class="bg-zinc-800 rounded-lg p-6 shadow-lg border border-zinc-700 animate-fade-in">
		<div class="inline-flex items-center gap-2 text-zinc-400 mb-4">
			<i data-lucide="mail" aria-hidden="true" class="text-violet-300"></i>
			<span>Get in Touch</span>
		</div>

		<h3 class="text-2xl font-bold syntax-string mb-4">Get in Touch</h3>

		<div class="space-y-4">
			<!-- Email -->
			<a href="mailto:filedwardb@gmail.com" class="flex items-center gap-4 bg-zinc-900/40 rounded-md p-4 border border-zinc-700 hover:bg-zinc-900/60">
				<div class="w-10 h-10 rounded-md bg-zinc-800 flex items-center justify-center text-sky-300">
					<i data-lucide="mail"></i>
				</div>
				<div class="text-zinc-300">
					<div class="text-xs text-zinc-500">Email</div>
					<div class="font-mono">filedwardb@gmail.com</div>
				</div>
			</a>

			<!-- Instagram -->
			<a href="https://www.instagram.com/pel.xx/" target="_blank" class="flex items-center gap-4 bg-zinc-900/40 rounded-md p-4 border border-zinc-700 hover:bg-zinc-900/60">
				<div class="w-10 h-10 rounded-md bg-zinc-800 flex items-center justify-center text-violet-300">
					<i class="fa-brands fa-instagram scale-150"></i>
				</div>
				<div class="text-zinc-300">
					<div class="text-xs text-zinc-500">Instagram</div>
					<div class="font-mono">@pel.xx</div>
				</div>
			</a>

			<!-- Twitter -->
			<a href="https://x.com/_pel_x" target="_blank" class="flex items-center gap-4 bg-zinc-900/40 rounded-md p-4 border border-zinc-700 hover:bg-zinc-900/60">
				<div class="w-10 h-10 rounded-md bg-zinc-800 flex items-center justify-center text-teal-300">
					<i class="fa-brands fa-twitter scale-125"></i>
				</div>
				<div class="text-zinc-300">
					<div class="text-xs text-zinc-500">Twitter</div>
					<div class="font-mono">@_pel_x</div>
				</div>
			</a>
		</div>
		</aside>
	</div>

	<!-- Right: Message form -->
	<section class="bg-zinc-800 rounded-lg p-6 shadow-lg border border-zinc-700 animate-fade-in">
		<div class="inline-flex items-center gap-2 text-zinc-400 mb-4">
			<i data-lucide="send" aria-hidden="true" class="text-violet-300"></i>
			<span>Send a Message</span>
		</div>

		<h3 class="text-2xl font-bold syntax-string mb-4">Send a Message</h3>

		<form id="contactForm" class="space-y-4" onsubmit="return sendMessage(event)">
			<div class="contact-field-group">
				<label class="text-zinc-400 text-sm block mb-1">Subject</label>
				<input type="text" name="title" placeholder="Message subject" data-required-message="Please enter a subject before sending." class="w-full rounded-md p-3 bg-zinc-900/30 border border-zinc-700 text-zinc-200 placeholder:text-zinc-500" />
				<p class="contact-field-popup hidden" aria-live="polite"></p>
			</div>

			<div class="contact-field-group">
				<label class="text-zinc-400 text-sm block mb-1">Name</label>
				<input type="text" name="name" placeholder="Your name" data-required-message="Please enter your name before sending." class="w-full rounded-md p-3 bg-zinc-900/30 border border-zinc-700 text-zinc-200 placeholder:text-zinc-500" />
				<p class="contact-field-popup hidden" aria-live="polite"></p>
			</div>

			<div class="contact-field-group">
				<label class="text-zinc-400 text-sm block mb-1">Email</label>
				<input type="email" name="email" placeholder="your@email.com" data-required-message="Please enter a valid email address." class="w-full rounded-md p-3 bg-zinc-900/30 border border-zinc-700 text-zinc-200 placeholder:text-zinc-500" />
				<p class="contact-field-popup hidden" aria-live="polite"></p>
			</div>

			<div class="contact-field-group">
				<label class="text-zinc-400 text-sm block mb-1">Message</label>
				<textarea name="message" placeholder="Your message ..." data-required-message="Please write a message before sending." class="w-full rounded-md p-3 bg-zinc-900/30 border border-zinc-700 text-zinc-200 placeholder:text-zinc-500 h-32 resize-y max-w-full"></textarea>
				<p class="contact-field-popup hidden" aria-live="polite"></p>
			</div>

			<div class="pt-2">
				<button id="sendMessageBtn" type="submit" class="w-full md:w-auto inline-flex items-center gap-3 justify-center bg-sky-400 hover:bg-sky-500 text-zinc-900 font-semibold rounded-md px-6 py-3 transition-all duration-300 ease-out">
					<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M22 2L11 13" stroke-linecap="round" stroke-linejoin="round"></path>
						<path d="M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"></path>
					</svg>
					<span id="sendMessageLabel">Send Message</span>
				</button>
			</div>

			<p id="sendMessageStatus" class="text-sm text-zinc-400 min-h-5"></p>
		</form>
	</section>
</div>
